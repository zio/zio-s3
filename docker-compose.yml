version: "3.7"

services:
  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
      - ./minio/export:/export
    environment:
      - MINIO_ROOT_USER=TESTKEY
      - MINIO_ROOT_PASSWORD=TESTSECRET
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: server /data --console-address ":9001"

  mc:
    image: quay.io/minio/mc
    volumes:
      - ./minio/export:/export
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=TESTKEY
      - MINIO_ROOT_PASSWORD=TESTSECRET
    entrypoint: >
      /bin/sh -c "
      echo Waiting for minio service to be ready...;
      echo Minio is ready;
      /usr/bin/mc alias set my-minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb -p my-minio/bucket-1;
      /usr/bin/mc mirror /export/ my-minio/bucket-1;
      /usr/bin/mc ls my-minio/bucket-1;
      "